stages: [build, deploy, production]

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  # Merge requests: a live preview at https://<app>-mr-<iid>.preview.example.com, removed on merge/close
  - component: $CI_SERVER_FQDN/platform/daas-deploy/review@1.0.0
    inputs:
      api_url: https://daas.example.com
  # Default branch: staging, then production. The production stage's tier is protected at group level
  # (approvals + allowed deployers), and GitLab holds the job until approved.
  - component: $CI_SERVER_FQDN/platform/daas-deploy/deploy@1.0.0
    inputs:
      environment: staging
      tier: staging
      api_url: https://daas.example.com
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - component: $CI_SERVER_FQDN/platform/daas-deploy/deploy@1.0.0
    inputs:
      environment: production
      tier: production
      stage: production
      api_url: https://daas.example.com
      environment_url: https://payments.example.com
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

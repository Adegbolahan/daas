# orders-api pipeline: build once, preview per MR, then qa -> staging -> production from main.
# Environment names route to stages (platform/stages.yaml); `tier` must be that stage's gitlabTier.
stages: [build, deploy, staging, production]

variables:
  DAAS_API: https://daas.example.com

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  # MR: live preview at https://orders-api-mr-<iid>.preview.example.com, removed on merge/close
  - component: $CI_SERVER_FQDN/platform/daas-deploy/review@1.0.0
    inputs:
      api_url: $DAAS_API
  # main: qa, staging (whichever target regions exist there), then production after approval
  - component: $CI_SERVER_FQDN/platform/daas-deploy/deploy@1.0.0
    inputs:
      environment: qa
      tier: testing
      api_url: $DAAS_API
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - component: $CI_SERVER_FQDN/platform/daas-deploy/deploy@1.0.0
    inputs:
      environment: staging
      tier: staging
      stage: staging
      api_url: $DAAS_API
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - component: $CI_SERVER_FQDN/platform/daas-deploy/deploy@1.0.0
    inputs:
      environment: production
      tier: production
      stage: production
      api_url: $DAAS_API
      environment_url: https://orders.example.com
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# How DAAS runs terraform/live: versions, state, and the pipeline's identities. Platform-owned.
requiredVersion: ">= 1.6"
image: hashicorp/terraform:1.9
providers:
  google: { source: hashicorp/google, version: ">= 5.0" }
  aws: { source: hashicorp/aws, version: ">= 5.81" }
state: { bucket: acme-terraform-state, prefix: daas/secrets }   # one state per stage (workspace)
# How the DAAS pipeline authenticates: GitLab OIDC, no stored keys. Plans run on MRs with
# read-only identities; applies run on the default branch with write identities that should
# trust only protected refs (see README > Terraform). AWS roles exist in every stage's account.
ci:
  gcpWorkloadIdentityProvider: projects/100000000009/locations/global/workloadIdentityPools/gitlab/providers/gitlab
  plan:  { gcpServiceAccount: daas-tf-plan@acme-platform.iam.gserviceaccount.com,  awsRole: daas-terraform-plan }
  apply: { gcpServiceAccount: daas-tf-apply@acme-platform.iam.gserviceaccount.com, awsRole: daas-terraform-apply }
